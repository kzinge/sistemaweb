<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro — MinhaApp</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#6ee7b7;--muted:#9aa4b2}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:linear-gradient(180deg,#071026 0%, #071730 60%);
      color:#e6eef6;
      display:grid;
      place-items:center;
    }
    form{
      width:min(420px,94%);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:32px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    h1{text-align:center;margin:0 0 10px 0;font-size:clamp(22px,3.2vw,28px)}
    label{font-weight:500;font-size:15px;color:var(--muted)}
    input[type="text"],input[type="password"],input[type="email"]{
      background-color:#0b1220;
      border:1px solid rgba(255,255,255,0.06);
      color:#e6eef6;
      border-radius:8px;
      padding:12px;
      font-size:15px;
      transition:border .15s ease, box-shadow .15s ease;
    }
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,231,183,0.25)}
    .btn{
      background:linear-gradient(90deg,#10b981,#06b6d4);
      color:#042027;
      font-weight:600;
      border:0;
      border-radius:10px;
      padding:12px 18px;
      font-size:15px;
      cursor:pointer;
      transition:transform .12s ease;
    }
    .btn:active{transform:translateY(1px)}
    .error{
      color:#f87171;
      font-size:14px;
      text-align:center;
      background-color:rgba(248,113,113,0.1);
      border-radius:8px;
      padding:8px;
    }
    .footer{
      text-align:center;
      font-size:14px;
      color:var(--muted);
    }
    .footer a{color:var(--accent);text-decoration:none}
    .footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <form action="/cadastro" method="POST">
    <h1>Criar Conta</h1>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <label for="username">Usuário</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Senha</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn">Cadastrar</button>

    <div class="footer">
      Já tem uma conta? <a href="/login">Entrar</a>
    </div>
  </form>
</body>
</html>

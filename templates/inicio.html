<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tela Inicial — Login / Cadastro</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#6ee7b7;--muted:#9aa4b2}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:linear-gradient(180deg,#071026 0%, #071730 60%);
      color:#e6eef6;
      display:grid;
      place-items:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .container{
      width:min(880px,94%);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:28px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      display:flex;
      gap:24px;
      align-items:center;
      justify-content:space-between;
      border:1px solid rgba(255,255,255,0.03);
    }
    .hero{
      flex:1 1 60%;
    }
    h1{margin:0 0 8px 0;font-size:clamp(20px,3.4vw,28px)}
    p{margin:0;color:var(--muted)}
    .actions{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .btn{
      appearance:none;
      border:0;
      padding:12px 18px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      font-size:15px;
      box-shadow:0 6px 18px rgba(2,6,23,0.45);
      transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn:focus{outline:3px solid rgba(110,231,183,0.18); outline-offset:3px}

    .btn-login{
      background:transparent;
      color:var(--accent);
      border:1px solid rgba(110,231,183,0.18);
      backdrop-filter:blur(6px);
    }
    .btn-cadastro{
      background:linear-gradient(90deg,#10b981,#06b6d4);
      color:#042027;
    }

    /* small: stack vertically */
    @media (max-width:700px){
      .container{flex-direction:column;align-items:stretch;padding:20px}
      .actions{justify-content:stretch}
      .btn{width:100%}
    }

    .logo{
      width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#083344,#0b6b5a);display:grid;place-items:center;font-weight:700;color:#cffeeb
    }
    .right-illustration{flex:1 1 36%;display:grid;place-items:center}
    .card-ghost{
      width:240px;height:160px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.03);display:grid;place-items:center;font-weight:600;color:var(--muted)
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="hero">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">
        <div class="logo" aria-hidden="true">GK</div>
        <div>
          <h1>Bem-vindo(a) à GKapp</h1>
          <p>Entre na sua conta ou crie um cadastro novo para começar.</p>
        </div>
      </div>

      <div class="actions" aria-hidden="false">
        <button id="loginBtn" class="btn btn-login" aria-label="Entrar — Login">Login</button>
        <button id="cadastroBtn" class="btn btn-cadastro" aria-label="Criar cadastro">Cadastro</button>
      </div>
    </div>

    <div class="right-illustration">
      <div class="card-ghost">Ilustração / Destaque</div>
    </div>
  </main>

  <script>
    // Hooks simples — substitua com navegação/rotas reais
    document.getElementById('loginBtn').addEventListener('click', ()=>{
      // exemplo: redireciona para /login
      window.location.href = '/login';
    });
    document.getElementById('cadastroBtn').addEventListener('click', ()=>{
      // exemplo: redireciona para /cadastro
      window.location.href = '/cadastro';
    });

    // Acessibilidade adicional: permite Enter/Space nos botões quando focados
    ['loginBtn','cadastroBtn'].forEach(id=>{
      const el = document.getElementById(id);
      el.addEventListener('keyup', (e)=>{
        if(e.key === 'Enter' || e.key === ' '){ el.click(); }
      });
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — MinhaApp</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#6ee7b7;--muted:#9aa4b2}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:linear-gradient(180deg,#071026 0%, #071730 60%);
      color:#e6eef6;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    header{
      background:#0b1220;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 28px;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    header h1{margin:0;font-size:20px;color:var(--accent)}
    nav a{
      color:var(--muted);
      text-decoration:none;
      margin-left:16px;
      font-weight:500;
      transition:color .15s ease;
    }
    nav a:hover{color:var(--accent)}
    main{
      flex:1;
      display:grid;
      place-items:center;
      padding:40px 16px;
    }
    .card{
      width:min(600px,94%);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:32px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }
    h2{margin-top:0;margin-bottom:12px;font-size:clamp(20px,3.2vw,26px)}
    p{color:var(--muted);line-height:1.5}
    .btn{
      background:linear-gradient(90deg,#10b981,#06b6d4);
      color:#042027;
      font-weight:600;
      border:0;
      border-radius:10px;
      padding:12px 18px;
      font-size:15px;
      cursor:pointer;
      transition:transform .12s ease;
    }
    .btn:active{transform:translateY(1px)}
    footer{
      text-align:center;
      padding:16px;
      font-size:14px;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>MinhaApp</h1>
    <nav>
      <a href="/dashboard">Início</a>
      <a href="/perfil">Perfil</a>
      <a href="/logout">Sair</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Bem-vindo(a), {{ current_user.username }}!</h2>
      <p>Você está logado com sucesso. Aqui é o seu painel principal.</p>
      <p>Use o menu acima para navegar entre as seções do sistema.</p>
      <br>
      <button class="btn" onclick="window.location.href='/perfil'">Ir para meu perfil</button>
    </div>
  </main>

  <footer>
    &copy; {{ year }} MinhaApp — Todos os direitos reservados.
  </footer>
</body>
</html>

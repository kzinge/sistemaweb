<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Cadastrar</h1>
    <form method="POST" action="{{url_for('locacao')}}">
        {{ form.hidden_tag() }}
        <div>
            {{ form.data_locacao.label }}<br>
            {{ form.data_locacao}}<br>
        </div>
        <div>
            {{ form.cliente_id.label }}<br>
            {{ form.cliente_id}}<br>
        </div>
        <div>
            {{ form.veiculo_id.label }}<br>
            {{ form.veiculo_id}}<br>
        </div>
        <div>
            {{ form.submit() }}
        </div>
    </form>
</body>
</html>
